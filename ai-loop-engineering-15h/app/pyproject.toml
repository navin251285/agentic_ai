[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "brightside-desk"
version = "0.1.0"
description = "Brightside support desk: a local FastAPI chat that runs the desk loop with caps and a stuck detector (AI loop engineering course app)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn>=0.54.0",
  "httpx>=0.28.1",
  "pydantic>=2.14.1",
  "langchain-core>=1.7.0",
  "langchain-google-genai>=4.4.2",
  "python-dotenv>=1.2.4",
  "tenacity>=9.1.4,<9.2",
]

[project.scripts]
brightside-desk = "brightside_desk.__main__:main"

[project.optional-dependencies]
test = ["pytest>=9.1.1", "vcrpy>=9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brightside_desk = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
