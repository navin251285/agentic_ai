# Lesson 24 lab: one entry point for the clients, two order nodes behind it.
events {}
http {
  # max_fails=1 fail_timeout=2s is lab-tuned for a fast demo; production values depend on your health-check intervals.
  upstream orders {
    server node-a:8000 max_fails=1 fail_timeout=2s;
    server node-b:8000 max_fails=1 fail_timeout=2s;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://orders;
      proxy_connect_timeout 1s;
      # a node that refuses, times out or fails is skipped and the other node answers
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
  }
}
