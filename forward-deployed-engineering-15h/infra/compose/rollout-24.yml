# Lesson 24 lab: two order nodes behind one proxy (lab, invented data).
# Started from the notebook with docker compose -p <project> -f <this file> --env-file ../.env up -d --build --wait
# NODE_A_TAG / NODE_A_SRC (and the B pair) pick each node's version for one call.
services:
  # node-a and node-b have the same healthcheck block on purpose: the proxy starts only after both pass it.
  node-a:
    build:
      context: ../../apps
      dockerfile: 24/Dockerfile
      args:
        APP_FILE: ${NODE_A_SRC:-24/orders_service_1_0_0.py}
    image: bb-orders:${NODE_A_TAG:-1.0.0}
    volumes:
      - ../../data/24:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 10
  node-b:
    build:
      context: ../../apps
      dockerfile: 24/Dockerfile
      args:
        APP_FILE: ${NODE_B_SRC:-24/orders_service_1_0_0.py}
    image: bb-orders:${NODE_B_TAG:-1.0.0}
    volumes:
      - ../../data/24:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 10
  proxy:
    image: nginx:1.27.5-alpine
    ports:
      - "8240:80"
    volumes:
      - ./rollout-24/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      node-a:
        condition: service_healthy
      node-b:
        condition: service_healthy
