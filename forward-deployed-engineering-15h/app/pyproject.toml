[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basket-bazaar-triage"
version = "0.3.0"
description = "Basket Bazaar delivery-issue triage: a local FastAPI backend and one web page (course app)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.14.1",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.2,<5",
    "vcrpy>=6.0",
    "tenacity>=9.1",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
]

[project.scripts]
delivery-triage = "delivery_triage.__main__:main"

[project.optional-dependencies]
test = ["pytest>=9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
delivery_triage = ["static/*.html"]
