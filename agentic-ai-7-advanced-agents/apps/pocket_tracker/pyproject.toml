[project]
name = "pocket-tracker"
version = "0.1.0"
description = "A tiny issue tracker: FastAPI + SQLite, server-rendered HTML."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.143.0", "uvicorn>=0.54.0", "jinja2>=3.1", "python-multipart>=0.0.20"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
