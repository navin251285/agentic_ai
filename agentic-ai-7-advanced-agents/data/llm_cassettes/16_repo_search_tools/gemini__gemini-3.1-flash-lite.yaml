      pyproject.toml =====\n[project]\nname = \"pocket-tracker\"\nversion = \"0.1.0\"\ndescription
      = \"A tiny issue tracker: FastAPI + SQLite, server-rendered HTML.\"\nrequires-python
      = \">=3.12\"\ndependencies = [\"fastapi>=0.143.0\", \"uvicorn>=0.54.0\", \"jinja2>=3.1\",
      \"python-multipart>=0.0.20\"]\n\n[tool.pytest.ini_options]\npythonpath = [\".\"]\ntestpaths
      = [\"tests\"]\n\n===== templates/about.html =====\n{% extends \"base.html\"
      %}{% set nav = \"about\" %}\n{% block title %}About{% endblock %}\n{% block
      content %}\n<h1>About</h1>\n<p>Pocket Trakcer helps small teams track issues.</p>\n<h2>Labels</h2>\n<ul>\n  <li><strong>bug</strong>:
      something does not work as described.</li>\n  <li><strong>docs</strong>: text
      on a page or in the docs is wrong or missing.</li>\n  <li><strong>feature</strong>:
      a request for something new.</li>\n</ul>\n{% endblock %}\n\n===== templates/base.html
      =====\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta
      name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>{%
      block title %}{% endblock %} \u00b7 Pocket Tracker</title>\n<style>\n  body
      { font-family: system-ui, sans-serif; margin: 0; color: #1f2933; background:
      #f5f7fa; }\n  header { display: flex; gap: 24px; align-items: center; padding:
      12px 24px; background: #243b53; color: #fff; }\n  header a { color: #d9e2ec;
      } header a[aria-current=\"page\"] { color: #fff; font-weight: 600; }\n  main
      { padding: 16px 24px; max-width: 960px; }\n  table { border-collapse: collapse;
      width: 100%; background: #fff; }\n  th, td { text-align: left; padding: 8px
      10px; border-bottom: 1px solid #e4e7eb; }\n  caption { text-align: left; padding:
      4px 0; color: #52606d; }\n  form { margin: 8px 0; } .comment { background: #fff;
      padding: 8px; margin: 6px 0; }\n</style>\n</head>\n<body>\n<header>\n  <strong>Pocket
      Tracker</strong>\n  <nav aria-label=\"Main\">\n    <a href=\"/issues\" {% if
      nav == \"issues\" %}aria-current=\"page\"{% endif %}>Issues</a> \u00b7\n    <a
      href=\"/issues/new\" {% if nav == \"new\" %}aria-current=\"page\"{% endif %}>New
      issue</a> \u00b7\n    <a href=\"/about\" {% if nav == \"about\" %}aria-current=\"page\"{%
      endif %}>About</a>\n  </nav>\n</header>\n<main>\n{% block content %}{% endblock
      %}\n</main>\n</body>\n</html>\n\n===== templates/issue.html =====\n{% extends
      \"base.html\" %}\n{% block title %}#{{ issue.id }} {{ issue.title }}{% endblock
      %}\n{% block content %}\n<h1>#{{ issue.id }} {{ issue.title }}</h1>\n<dl>\n  <dt>Status</dt><dd
      id=\"status\">{{ issue.status }}</dd>\n  <dt>Label</dt><dd id=\"label\">{{ issue.label
      or \"none\" }}</dd>\n  <dt>Created</dt><dd>{{ issue.created_at }}</dd>\n</dl>\n<p
      style=\"white-space: pre-line\">{{ issue.body }}</p>\n{% if issue.status ==
      \"open\" %}\n<form method=\"post\" action=\"/issues/{{ issue.id }}/close\" aria-label=\"Close
      issue\">\n  <button type=\"submit\">Close issue</button>\n</form>\n{% else %}\n<form
      method=\"post\" action=\"/issues/{{ issue.id }}/reopen\" aria-label=\"Reopen
      issue\">\n  <button type=\"submit\">Reopen issue</button>\n</form>\n{% endif
      %}\n<form method=\"post\" action=\"/issues/{{ issue.id }}/label\" aria-label=\"Change
      label\">\n  <label for=\"new-label\">Label</label>\n  <select id=\"new-label\"
      name=\"label\">\n    <option value=\"\">none</option>\n    {% for l in labels
      %}<option value=\"{{ l }}\" {% if l == issue.label %}selected{% endif %}>{{
      l }}</option>{% endfor %}\n  </select>\n  <button type=\"submit\">Save label</button>\n</form>\n<h2>Comments</h2>\n{%
      for c in issue.comments %}\n  <div class=\"comment\" role=\"article\" aria-label=\"Comment
      {{ loop.index }}\">{{ c.body | replace(\"\\n\", \"<br>\") | safe }}</div>\n{%
      else %}\n  <p>No comments yet.</p>\n{% endfor %}\n<form method=\"post\" action=\"/issues/{{
      issue.id }}/comments\" aria-label=\"Add comment\">\n  <label for=\"comment\">Comment</label>\n  <textarea
      id=\"comment\" name=\"body\" rows=\"3\" required></textarea>\n  <button type=\"submit\">Add
      comment</button>\n</form>\n{% endblock %}\n\n===== templates/issues.html =====\n{%
      extends \"base.html\" %}{% set nav = \"issues\" %}\n{% block title %}Issues{%
      endblock %}\n{% block content %}\n<h1>Issues</h1>\n<p id=\"open-count\">{{ open_count
      }} open issues</p>\n<form role=\"search\" aria-label=\"Filter issues\" method=\"get\"
      action=\"/issues\">\n  <label for=\"q\">Search</label>\n  <input id=\"q\" name=\"q\"
      type=\"search\" value=\"{{ q }}\">\n  <label for=\"status\">Status</label>\n  <select
      id=\"status\" name=\"status\">\n    <option value=\"\" {% if not status %}selected{%
      endif %}>any</option>\n    {% for s in [\"open\", \"closed\"] %}<option value=\"{{
      s }}\" {% if s == status %}selected{% endif %}>{{ s }}</option>{% endfor %}\n  </select>\n  <label
      for=\"label\">Label</label>\n  <select id=\"label\" name=\"label\">\n    <option
      value=\"\" {% if not label %}selected{% endif %}>any</option>\n    {% for l
      in labels %}<option value=\"{{ l }}\" {% if l == label %}selected{% endif %}>{{
      l }}</option>{% endfor %}\n  </select>\n  <button type=\"submit\">Filter</button>\n</form>\n<table>\n  <caption>{{
      issues|length }} issues shown</caption>\n  <thead><tr><th scope=\"col\">#</th><th
      scope=\"col\">Title</th><th scope=\"col\">Label</th><th scope=\"col\">Status</th><th
      scope=\"col\">Comments</th></tr></thead>\n  <tbody>\n  {% for issue in issues
      %}\n    <tr data-issue-id=\"{{ issue.id }}\">\n      <td>{{ issue.id }}</td>\n      <td><a
      href=\"/issues/{{ issue.id }}\">{{ issue.title }}</a></td>\n      <td>{{ issue.label
      or \"none\" }}</td>\n      <td>{{ issue.status }}</td>\n      <td>{{ issue.comment_count
      }}</td>\n    </tr>\n  {% endfor %}\n  </tbody>\n</table>\n{% endblock %}\n\n=====
      templates/login.html =====\n{% extends \"base.html\" %}\n{% block title %}Log
      in{% endblock %}\n{% block content %}\n<h1>Log in</h1>\n{% if error %}<p role=\"alert\">{{
      error }}</p>{% endif %}\n<form method=\"post\" action=\"/login\" aria-label=\"Log
      in\">\n  <input type=\"hidden\" name=\"next\" value=\"{{ next }}\">\n  <p><label
      for=\"username\">Username</label> <input id=\"username\" name=\"username\" autocomplete=\"username\"></p>\n  <p><label
      for=\"password\">Password</label> <input id=\"password\" name=\"password\" type=\"password\"
      autocomplete=\"current-password\"></p>\n  <button type=\"submit\">Log in</button>\n</form>\n{%
      endblock %}\n\n===== templates/new_issue.html =====\n{% extends \"base.html\"
      %}{% set nav = \"new\" %}\n{% block title %}New issue{% endblock %}\n{% block
      content %}\n<h1>New issue</h1>\n<form method=\"post\" action=\"/issues\" aria-label=\"New
      issue\">\n  <p><label for=\"title\">Title</label> <input id=\"title\" name=\"title\"
      required></p>\n  <p><label for=\"body\">Description</label> <textarea id=\"body\"
      name=\"body\" rows=\"4\"></textarea></p>\n  <p><label for=\"label\">Label</label>\n    <select
      id=\"label\" name=\"label\">\n      <option value=\"\">none</option>\n      {%
      for l in labels %}<option value=\"{{ l }}\">{{ l }}</option>{% endfor %}\n    </select></p>\n  <button
      type=\"submit\">Create issue</button>\n</form>\n{% endblock %}\n\n===== tests/conftest.py
      =====\nimport pytest\nfrom fastapi.testclient import TestClient\n\nfrom app
      import app\n\n\n@pytest.fixture\ndef client(tmp_path, monkeypatch):\n    \"\"\"A
      test client on a fresh database seeded from issues.json.\"\"\"\n    monkeypatch.setenv(\"POCKET_TRACKER_DB\",
      str(tmp_path / \"test.db\"))\n    with TestClient(app) as test_client:   # the
      with-block runs startup (creates and seeds the db)\n        yield test_client\n\n=====
      tests/test_app.py =====\ndef test_health(client):\n    assert client.get(\"/health\").json()
      == {\"status\": \"ok\"}\n\n\ndef test_issue_list_shows_seeded_issues(client):\n    page
      = client.get(\"/issues\")\n    assert page.status_code == 200\n    assert \"Login
      page broken\" in page.text\n    assert len(client.get(\"/api/issues\").json())
      == 10\n\n\ndef test_filter_by_status_and_label(client):\n    closed = client.get(\"/api/issues\",
      params={\"status\": \"closed\"}).json()\n    assert [i[\"id\"] for i in closed]
      == [10]\n    features = client.get(\"/api/issues\", params={\"label\": \"feature\"}).json()\n    assert
      [i[\"id\"] for i in features] == [8, 9]\n\n\ndef test_search_finds_matching_title(client):\n    found
      = client.get(\"/api/issues\", params={\"q\": \"Login\"}).json()\n    assert
      [i[\"id\"] for i in found] == [1]\n\n\ndef test_create_issue(client):\n    reply
      = client.post(\"/issues\", data={\"title\": \"Export to CSV\", \"label\": \"feature\"})\n    assert
      reply.status_code == 200 and \"Export to CSV\" in reply.text   # redirected
      to the new issue\n    assert client.get(\"/api/issues/11\").json()[\"label\"]
      == \"feature\"\n\n\ndef test_close_and_reopen(client):\n    client.post(\"/issues/3/close\")\n    assert
      client.get(\"/api/issues/3\").json()[\"status\"] == \"closed\"\n    client.post(\"/issues/3/reopen\")\n    assert
      client.get(\"/api/issues/3\").json()[\"status\"] == \"open\"\n\n\ndef test_change_label(client):\n    client.post(\"/issues/1/label\",
      data={\"label\": \"docs\"})\n    issue = client.get(\"/api/issues/1\").json()\n    assert
      issue[\"label\"] == \"docs\" and issue[\"status\"] == \"open\"\n\n\ndef test_add_comment(client):\n    client.post(\"/issues/2/comments\",
      data={\"body\": \"I can reproduce this.\"})\n    assert [c[\"body\"] for c in
      client.get(\"/api/issues/2\").json()[\"comments\"]] == [\"I can reproduce this.\"]\n    assert
      client.get(\"/api/issues\", params={\"q\": \"Search\"}).json()[0][\"comment_count\"]
      == 1\n\n\ndef test_missing_issue_is_404(client):\n    assert client.get(\"/issues/999\").status_code
      == 404\n\n\ndef test_about_page(client):\n    assert \"Labels\" in client.get(\"/about\").text\n\n\nIssue
      #7: Closing an issue resets its label\nWhen I close an issue its label disappears.\nSteps:
      open issue #2 (label ''bug'') and press ''Close issue''.\nExpected: the issue
      is closed and still labelled ''bug''. Actual: the label is empty.\nFind the
      line of code that causes this bug. Do not fix it. End with one line: ANSWER:
      <file>:<line> - <short reason>"}], "role": "user"}], "safetySettings": [], "generationConfig":
      {"temperature": 0.0, "candidateCount": 1}}'
