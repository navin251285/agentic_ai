- request:
    body: '{"contents": [{"parts": [{"text": "Here is every file in the Pocket Tracker
      repo.\n===== .gitignore =====\n__pycache__/\n.pytest_cache/\n*.db\n\n===== README.md
      =====\n# Pocket Tracker\n\nA tiny issue tracker: FastAPI + SQLite + server-rendered
      HTML. It is the app the course''s\nbrowser agents drive and the repo its coding
      agents fix. Its open bugs are listed in `issues.json`.\n\n## Files\n- `app.py`
      \u2014 routes: HTML pages, form posts, a small JSON API under `/api`\n- `db.py`
      \u2014 SQLite storage, plain SQL\n- `templates/` \u2014 Jinja2 pages (labelled
      forms and buttons)\n- `issues.json` \u2014 the issue backlog; also seeds an
      empty database\n- `tests/` \u2014 the pytest suite (`python -m pytest -q`)\n\n##
      Run\n```\nuvicorn app:app --host 127.0.0.1 --port 8000\n```\nSet `POCKET_TRACKER_DB`
      to choose the database file (default `pocket_tracker.db` here).\nA new database
      is seeded from `issues.json`; delete the file to start again.\n\n## Pages\n|
      URL | What |\n|---|---|\n| `/issues?q=&status=&label=` | issue list with search
      and filters |\n| `/issues/new` | new-issue form |\n| `/issues/{id}` | one issue:
      close/reopen, label, comments |\n| `/about` | about page |\n| `/health` | `{\"status\":
      \"ok\"}` |\n| `/api/issues`, `/api/issues/{id}` | the same data as JSON |\n\n##
      Working on a copy\nLessons never change this folder. Each one copies it to a
      scratch folder, makes that a git\nrepo with one commit, and resets with `git
      reset --hard && git clean -fdx`.\n\n===== app.py =====\n\"\"\"Pocket Tracker:
      a tiny issue tracker (FastAPI + SQLite + server-rendered HTML).\n\nRun:  uvicorn
      app:app --host 127.0.0.1 --port 8000\nThe database file comes from POCKET_TRACKER_DB
      (default: pocket_tracker.db here).\n\"\"\"\nimport os\nfrom contextlib import
      asynccontextmanager\nfrom pathlib import Path\n\nfrom fastapi import FastAPI,
      Form, HTTPException, Request\nfrom fastapi.responses import RedirectResponse\nfrom
      fastapi.templating import Jinja2Templates\n\nimport db\n\nHERE = Path(__file__).parent\ntemplates
      = Jinja2Templates(directory=HERE / \"templates\")\n\n\n@asynccontextmanager\nasync
      def lifespan(app):\n    app.state.db = os.environ.get(\"POCKET_TRACKER_DB\",
      str(HERE / \"pocket_tracker.db\"))\n    db.init_db(app.state.db, HERE / \"issues.json\")\n    yield\n\n\napp
      = FastAPI(title=\"Pocket Tracker\", lifespan=lifespan)\n\n\ndef found(request,
      issue_id):\n    issue = db.get_issue(request.app.state.db, issue_id)\n    if
      issue is None:\n        raise HTTPException(404, f\"No issue #{issue_id}\")\n    return
      issue\n\n\ndef back_to(issue_id):\n    return RedirectResponse(f\"/issues/{issue_id}\",
      status_code=303)\n\n\n@app.get(\"/health\")\ndef health():\n    return {\"status\":
      \"ok\"}\n\n\n@app.get(\"/\")\ndef home():\n    return RedirectResponse(\"/issues\",
      status_code=303)\n\n\n@app.get(\"/issues\")\ndef issue_list(request: Request,
      q: str = \"\", status: str = \"\", label: str = \"\"):\n    path = request.app.state.db\n    context
      = {\"issues\": db.list_issues(path, q, status, label), \"open_count\": db.count_open(path),\n               \"q\":
      q, \"status\": status, \"label\": label, \"labels\": db.LABELS}\n    return
      templates.TemplateResponse(request, \"issues.html\", context)\n\n\n@app.get(\"/issues/new\")\ndef
      new_issue_form(request: Request):\n    return templates.TemplateResponse(request,
      \"new_issue.html\", {\"labels\": db.LABELS})\n\n\n@app.post(\"/issues\")\ndef
      create_issue(request: Request, title: str = Form(...), body: str = Form(\"\"),
      label: str = Form(\"\")):\n    issue_id = db.create_issue(request.app.state.db,
      title, body, label)\n    return back_to(issue_id)\n\n\n@app.get(\"/issues/{issue_id}\")\ndef
      issue_page(request: Request, issue_id: int):\n    context = {\"issue\": found(request,
      issue_id), \"labels\": db.LABELS}\n    return templates.TemplateResponse(request,
      \"issue.html\", context)\n\n\n@app.post(\"/issues/{issue_id}/close\")\ndef close_issue(request:
      Request, issue_id: int):\n    found(request, issue_id)\n    db.update_issue(request.app.state.db,
      issue_id, status=\"closed\")\n    return back_to(issue_id)\n\n\n@app.post(\"/issues/{issue_id}/reopen\")\ndef
      reopen_issue(request: Request, issue_id: int):\n    issue = found(request, issue_id)\n    db.update_issue(request.app.state.db,
      issue_id, status=\"open\", label=issue[\"label\"])\n    return back_to(issue_id)\n\n\n@app.post(\"/issues/{issue_id}/label\")\ndef
      set_label(request: Request, issue_id: int, label: str = Form(\"\")):\n    found(request,
      issue_id)\n    db.update_issue(request.app.state.db, issue_id, label=label)\n    return
      back_to(issue_id)\n\n\n@app.post(\"/issues/{issue_id}/comments\")\ndef add_comment(request:
      Request, issue_id: int, body: str = Form(...)):\n    found(request, issue_id)\n    db.add_comment(request.app.state.db,
      issue_id, body)\n    return back_to(issue_id)\n\n\n@app.get(\"/about\")\ndef
      about(request: Request):\n    return templates.TemplateResponse(request, \"about.html\",
      {\"labels\": db.LABELS})\n\n\n@app.get(\"/login\")\ndef login(request: Request):\n    return
      templates.TemplateResponse(request, \"login.html\", {\"next\": request.query_params.get(\"next\",
      \"/issues\"),\n                                                              \"error\":
      error})\n\n\n# JSON API: the same data for scripts and agents.\n@app.get(\"/api/issues\")\ndef
      api_list(request: Request, q: str = \"\", status: str = \"\", label: str = \"\"):\n    return
      db.list_issues(request.app.state.db, q, status, label)\n\n\n@app.get(\"/api/issues/{issue_id}\")\ndef
      api_issue(request: Request, issue_id: int):\n    return found(request, issue_id)\n\n=====
      db.py =====\n\"\"\"SQLite storage for Pocket Tracker. One connection per call;
      plain SQL.\"\"\"\nimport json\nimport sqlite3\nfrom contextlib import contextmanager\nfrom
      datetime import datetime, timezone\nfrom pathlib import Path\n\nLABELS = [\"bug\",
      \"docs\", \"feature\"]\n\nSCHEMA = \"\"\"\nCREATE TABLE IF NOT EXISTS issues
      (\n    id INTEGER PRIMARY KEY,\n    title TEXT NOT NULL,\n    body TEXT NOT
      NULL DEFAULT '''',\n    label TEXT NOT NULL DEFAULT '''',\n    status TEXT NOT
      NULL DEFAULT ''open'',\n    created_at TEXT NOT NULL\n);\nCREATE TABLE IF NOT
      EXISTS comments (\n    id INTEGER PRIMARY KEY,\n    issue_id INTEGER NOT NULL
      REFERENCES issues(id),\n    body TEXT NOT NULL,\n    created_at TEXT NOT NULL\n);\n\"\"\"\n\n\n@contextmanager\ndef
      connect(path):\n    \"\"\"Open the database, commit on success, always close.\"\"\"\n    conn
      = sqlite3.connect(path)\n    conn.row_factory = sqlite3.Row\n    try:\n        with
      conn:\n            yield conn\n    finally:\n        conn.close()\n\n\ndef now():\n    return
      datetime.now(timezone.utc).isoformat(timespec=\"seconds\")\n\n\ndef init_db(path,
      seed_file):\n    \"\"\"Create the tables; load issues.json if the database has
      no issues yet.\"\"\"\n    with connect(path) as conn:\n        conn.executescript(SCHEMA)\n        if
      conn.execute(\"SELECT COUNT(*) FROM issues\").fetchone()[0] == 0:\n            for
      issue in json.loads(Path(seed_file).read_text()):\n                conn.execute(\n                    \"INSERT
      INTO issues (id, title, body, label, status, created_at) \"\n                    \"VALUES
      (:id, :title, :body, :label, :status, :created_at)\", issue)\n\n\ndef list_issues(path,
      q=\"\", status=\"\", label=\"\"):\n    sql = (\"SELECT issues.*, COUNT(comments.id)
      AS comment_count FROM issues \"\n           \"LEFT JOIN comments ON comments.issue_id
      = issues.id WHERE 1 = 1\")\n    params = []\n    if q:\n        sql += \" AND
      instr(issues.title, ?) > 0\"\n        params.append(q)\n    if status:\n        sql
      += \" AND issues.status = ?\"\n        params.append(status)\n    if label:\n        sql
      += \" AND issues.label = ?\"\n        params.append(label)\n    sql += \" GROUP
      BY issues.id ORDER BY issues.id\"\n    with connect(path) as conn:\n        return
      [dict(row) for row in conn.execute(sql, params)]\n\n\ndef count_open(path):\n    with
      connect(path) as conn:\n        total = conn.execute(\"SELECT COUNT(*) FROM
      issues\").fetchone()[0]\n        closed = conn.execute(\"SELECT COUNT(*) FROM
      issues WHERE status = ''Closed''\").fetchone()[0]\n    return total - closed\n\n\ndef
      get_issue(path, issue_id):\n    with connect(path) as conn:\n        row = conn.execute(\"SELECT
      * FROM issues WHERE id = ?\", (issue_id,)).fetchone()\n        if row is None:\n            return
      None\n        issue = dict(row)\n        issue[\"comments\"] = [dict(c) for
      c in conn.execute(\n            \"SELECT * FROM comments WHERE issue_id = ?
      ORDER BY id\", (issue_id,))]\n    return issue\n\n\ndef create_issue(path, title,
      body=\"\", label=\"\"):\n    with connect(path) as conn:\n        cur = conn.execute(\n            \"INSERT
      INTO issues (title, body, label, status, created_at) VALUES (?, ?, ?, ''open'',
      ?)\",\n            (title, body, label, now()))\n        return cur.lastrowid\n\n\ndef
      update_issue(path, issue_id, status=None, label=\"\"):\n    \"\"\"Change an
      issue''s status and/or label.\"\"\"\n    with connect(path) as conn:\n        conn.execute(\n            \"UPDATE
      issues SET status = COALESCE(?, status), label = ? WHERE id = ?\",\n            (status,
      label, issue_id))\n\n\ndef add_comment(path, issue_id, body):\n    with connect(path)
      as conn:\n        conn.execute(\"INSERT INTO comments (issue_id, body, created_at)
      VALUES (?, ?, ?)\",\n                     (issue_id, body, now()))\n\n=====
