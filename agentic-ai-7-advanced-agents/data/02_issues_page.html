<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issues · Pocket Tracker</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; color: #1f2933; background: #f5f7fa; }
  header { display: flex; align-items: center; gap: 24px; padding: 12px 24px; background: #243b53; color: #fff; }
  header a { color: #d9e2ec; text-decoration: none; }
  header a[aria-current="page"] { color: #fff; font-weight: 600; }
  main { padding: 16px 24px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .toolbar input { padding: 6px 8px; width: 260px; border: 1px solid #9fb3c8; border-radius: 4px; }
  .btn { padding: 6px 12px; border-radius: 4px; border: 1px solid #334e68; background: #334e68; color: #fff; cursor: pointer; }
  .icon-btn { padding: 4px 6px; border: 1px solid #9fb3c8; background: #fff; border-radius: 4px; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e4e7eb; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .badge-open { background: #ffe3e3; color: #a61b1b; }
  .badge-closed { background: #e3f9e5; color: #0e5814; }
  .admin { display: none; }
  .chart { margin-top: 16px; background: #fff; padding: 8px; display: inline-block; }
</style>
</head>
<body>
<header>
  <strong>Pocket Tracker</strong>
  <nav aria-label="Main">
    <a href="/issues" aria-current="page">Issues</a> ·
    <a href="/board">Board</a> ·
    <a href="/about">About</a>
  </nav>
</header>
<main>
  <h1>Issues</h1>
  <div class="toolbar">
    <label for="q">Search issues</label>
    <input id="q" name="q" type="search" placeholder="e.g. login" style="">
    <button class="btn" type="button">New issue</button>
    <button class="icon-btn" type="button" title=""><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 2v8M4 7l4 4 4-4M2 14h12" stroke="#243b53" stroke-width="2" fill="none"></path></svg></button>
  </div>
  <table>
    <thead><tr><th>#</th><th>Title</th><th>Status</th><th>Comments</th></tr></thead>
    <tbody>
      <tr data-issue-id="1"><td>1</td><td><a href="/issues/1">Login page broken</a></td><td><span class="badge badge-open">open</span></td><td>0</td></tr>
      <tr data-issue-id="2"><td>2</td><td><a href="/issues/2">Search ignores capital letters</a></td><td><span class="badge badge-open">open</span></td><td>0</td></tr>
      <tr data-issue-id="3"><td>3</td><td><a href="/issues/3">Typo on the About page: 'Trakcer' should be 'Tracker'</a></td><td><span class="badge badge-closed">closed</span></td><td>1</td></tr>
    </tbody>
  </table>
  <div class="admin"><button class="btn" type="button">Delete all issues</button></div>
  <div class="chart"><canvas id="chart" width="320" height="90"></canvas></div>
</main>
<script>
  const ctx = document.getElementById("chart").getContext("2d");
  ctx.font = "14px sans-serif"; ctx.fillStyle = "#1f2933";
  ctx.fillText("Open vs closed", 8, 18);
  ctx.fillStyle = "#e12d39"; ctx.fillRect(8, 30, 200, 22);
  ctx.fillStyle = "#3ebd93"; ctx.fillRect(8, 60, 100, 22);
  ctx.fillStyle = "#1f2933";
  ctx.fillText("2 open", 216, 46); ctx.fillText("1 closed", 116, 76);
</script>


</body></html>
