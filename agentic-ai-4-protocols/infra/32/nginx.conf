# Lesson 32: the proxy in front of the two Trackr replicas (nginx 1.27.5, pinned in docker-compose.yml).
# Round-robin over both replicas. Buffering is off so SSE frames reach the client as they are written.
upstream trackr {
    server trackr-a:8000;
    server trackr-b:8000;
}
server {
    listen 8080;
    client_max_body_size 4m;
    location / {
        proxy_pass http://trackr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
