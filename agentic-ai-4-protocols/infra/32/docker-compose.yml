# Lesson 32: nginx in front of two Trackr replicas that share one task store (the SQLite file in data/32).
# Started from the notebook: docker compose -p tut-agentic-ai-4-protocols-32 -f ../infra/32/docker-compose.yml up -d --build
# Image tags are pinned. The stack needs no keys: the replicas create no new tasks here, so no model is called.
# RAM: about 300 MB for the three containers.
x-trackr: &trackr
  build:
    context: ../../data/32/build
    dockerfile: Dockerfile
  image: tut-agentic-ai-4-protocols-32-trackr:local
  command: ["uvicorn", "trackr_asgi:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "172.30.32.10"]
  volumes:
    - ../../data/32:/data
  environment: &trackr-env
    TRACKR_DB_URL: sqlite+aiosqlite:////data/tasks.db
    TRACKR_ALLOWED_HOSTS: localhost,127.0.0.1
    TRACKR_ISSUES: /app/issues.json
    TRACKR_MODEL: "off"
services:
  trackr-a:
    <<: *trackr
    container_name: tut-agentic-ai-4-protocols-32-trackr-a
    environment:
      <<: *trackr-env
      TRACKR_REPLICA: a
      TRACKR_PUBLIC_URL: http://localhost:8321
    ports:
      - "127.0.0.1:8321:8000"
    networks:
      trackr:
        ipv4_address: 172.30.32.11
  trackr-b:
    <<: *trackr
    container_name: tut-agentic-ai-4-protocols-32-trackr-b
    depends_on: [trackr-a]
    environment:
      <<: *trackr-env
      TRACKR_REPLICA: b
      TRACKR_PUBLIC_URL: http://localhost:8322
    ports:
      - "127.0.0.1:8322:8000"
    networks:
      trackr:
        ipv4_address: 172.30.32.12
  proxy:
    image: nginx:1.27.5-alpine
    container_name: tut-agentic-ai-4-protocols-32-proxy
    depends_on: [trackr-a, trackr-b]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8320:8080"
    networks:
      trackr:
        ipv4_address: 172.30.32.10
networks:
  trackr:
    ipam:
      config:
        - subnet: 172.30.32.0/24
