[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "support-desk"
version = "0.3.0"
description = "Brightside support desk: a local FastAPI chat with an order-lookup agent and a refund desk (agentic-ai course app)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.150.0",
  "uvicorn>=0.54.0",
  "httpx>=0.28.1",
  "pydantic>=2.14.1",
  "langchain-core>=1.6.12",
  "langgraph>=1.2.16",
  "langgraph-checkpoint-sqlite>=3.1.2",
  "langchain-google-genai>=4.4.2",
  "google-genai>=2.31.0",
  "vcrpy>=8.3.0",
  "opentelemetry-sdk>=1.45.1",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
support_desk = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
