      string: "{\n  \"candidates\": [\n    {\n      \"content\": {\n        \"role\": \"model\",\n        \"parts\": [\n          {\n            \"text\": \"Hello,\\n\\nI have processed your request for a refund of 210.00 USD for order 1007. Please note that while I have initiated this process, a refund requires final approval from a member of our team before the funds are transferred. I have received confirmation that the refund status is currently \\\"refunded\\\" pending that final review.\\n\\nRegarding our policy on lost parcels, our records indicate that if we are unable to fulfill an order, we are required to provide a prompt refund of the total amount paid [policy-27, policy-31].\\n\\nI will send a follow-up email to you once the refund has been fully approved and finalized.\",\n            \"thoughtSignature\": \"AY89a1/2HCSm9CAsdD4XUlCOdrkAbao0b6J71Eq2/pfQP6n8G/sOjRHrCeVAUFiox6F6M8YLm30qR6FperaoNi85DXPCRQbZzD9l5107dQI1rbblij9Ov6I/4wU=\"\n          }\n        ]\n      },\n      \"finishReason\": \"STOP\"\n    }\n  ],\n  \"usageMetadata\": {\n    \"promptTokenCount\": 557,\n    \"candidatesTokenCount\": 140,\n    \"totalTokenCount\": 697,\n    \"trafficType\": \"ON_DEMAND\",\n    \"promptTokensDetails\": [\n      {\n        \"modality\": \"TEXT\",\n        \"tokenCount\": 557\n      }\n    ],\n    \"candidatesTokensDetails\": [\n      {\n        \"modality\": \"TEXT\",\n        \"tokenCount\": 140\n      }\n    ]\n  },\n  \"modelVersion\": \"gemini-3.1-flash-lite\",\n  \"createTime\": \"2026-10-21T07:38:22.108063Z\",\n  \"responseId\": \"7mvYap_MBt-ar8kPg5aO8A0\"\n}\n"
