- request:
    body: '{"contents": [{"parts": [{"text": "Question: A customer ordered a jacket
      20 days ago and the shop now says it will ship in 45 days. Can they cancel for
      a full refund?\n\nPassages:\n[9] Some businesses adopt internal deadlines that
      are earlier than those set by the Rule to ensure that their delay notices give
      all customers a meaningful opportunity to consent to the delay. If businesses
      fail to ship or give delay notifications by their internal deadlines, they automatically
      cancel the orders and make refunds.\n\nIn any event, no notification to the
      customer can take longer than the time you originally promised or, if no time
      was promised, 30 days. If you cannot ship the order or provide the notice within
      this time, you must cancel the order and make a prompt refund.\n\nWhat a First
      Delay Option Notice Must Say\n\n[8] When you learn that you cannot ship on time,
      you must decide whether you will ever be able to ship the order. If you decide
      that you cannot, you must promptly cancel the order and make a full refund.\n\nIf
      you decide you can ship the order later, you must seek the customer\u2019s consent
      to the delay. You may use whatever means you wish to do this -- such as the
      telephone, fax, mail, or email -- as long as you notify the customer of the
      delay reasonably quickly. The customer must have sufficient advance notification
      to make a meaningful decision to consent to the delay or cancel the order.\n\n[21]
      You must cancel an order and provide a prompt refund when:\n\n- the customer
      exercises any option to cancel before you ship the merchandise;\n\n- the customer
      does not respond to your first notice of a definite revised shipment date of
      30 days or less and you have not shipped the merchandise or received the customer\u2019s
      consent to a further delay by the definite revised shipment date;\n\n- the customer
      does not respond to your notice of a definite revised shipment date of more
      than 30 days (or your notice that you are unable to provide a definite revised
      shipment date) and you have not shipped the merchandise within 30 days of the
      original shipment date;\n\n[20] - the reason for the delay, and\n\n- a statement
      that, if the customer agrees to the indefinite delay, the customer may cancel
      the order any time until you ship.\n\nIf you have provided an appropriate and
      timely delay option notice and the customer agrees to an indefinite revised
      shipment date, no additional delay notices are required.\n\nWhen You May Cancel
      an Order\n\nInstead of seeking the customer\u2019s consent to delay, you can
      always cancel the order and send a refund. In that case, you must notify the
      customer and send the refund within the time you would have sent any delay notice
      required by the Rule.\n\nWhen You Must Cancel an Order\n\n[25] - Having heard
      nothing from the customer, on August 10 you realize that you will not be able
      to ship by August 30, so reasonably promptly you send a second delay option
      notice saying when you now reasonably believe you will be able to ship. The
      notice tells the customer that the order will be cancelled automatically on
      August 30 unless you have already shipped by then or the customer expressly
      tells you not to cancel.\n\nHow Quickly You Must Make a Refund\n\nWhen you must
      make a Rule-required refund, the following applies:\n\n[10] In seeking your
      customer\u2019s consent to delay, the first delay notice you provide to the
      customer (the \"delay option\" notice) must include:\n\n- a definite revised
      shipment date or, if unknown, a statement that you are unable to provide a revised
      shipment date;\n\n- a statement that, if the customer chooses not to wait, the
      customer can cancel the order and obtain a full and prompt refund; and\n\n-
      some means for the customer to choose to cancel at your expense (e.g., by providing
      a postage prepaid reply card, toll-free telephone number, or website).\n\n-
      the following information when you cannot provide a revised shipping date:\n-
      the reason for the delay, and\n\n[15] If you don\u2019t want to wait, you may
      cancel your order and receive a prompt refund by calling our toll-free customer
      service number, (800) 555-1234. If we do not hear from you and we have not shipped
      by [date 30 days later than original promised shipment time -- in this example,
      60 days after receipt of the properly completed order], your order will be cancelled
      automatically and your money will be refunded.\n\n[26] - If the customer paid
      by cash, check, money order, or by credit where a third party is the creditor,
      or by any other method except credit where you are a creditor, you must refund
      the correct amount within seven working days after the order is cancelled.\n\n-
      If the customer paid by credit where you are a creditor, you must credit the
      customter''s account or notify the customer that the account will not be charged
      within one billing cycle after the order is cancelled.\n\nHow Much You Must
      Refund"}], "role": "user"}], "systemInstruction": {"parts": [{"text": "You rank
      passages for a support question. Put first the passages that answer the question
      most directly. Use only the chunk numbers you were given. Return every number
      once."}], "role": "user"}, "generationConfig": {"temperature": 0.0, "responseMimeType":
      "application/json", "responseSchema": {"properties": {"best_first": {"description":
      "the chunk numbers, most useful for answering the question first", "items":
      {"type": "INTEGER"}, "title": "Best First", "type": "ARRAY"}}, "required": ["best_first"],
      "title": "Ranking", "type": "OBJECT"}}}'
